version: 2
# Weekly, with all the updates of one kind grouped into a single pull request.
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    groups:
      web-dependencies:
        patterns: ["*"]
  # The two base images in the Dockerfile are pinned by digest; this proposes refreshed builds
  # of the same Python and Node versions (they carry the security fixes). A newer Python or
  # Node is a decision of its own, because the lock file and the tests are tied to the version.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    groups:
      docker-base-images:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
