name: CI

# Tests and lint for the Python code, and a build of the web UI, on every push to main and on
# every pull request. No live Plex or Emby server is involved: the tests use recorded responses.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the compose example
        run: docker compose -f compose.example.yaml config --quiet

      - name: Build the image
        run: docker build -t horus-media:ci .

      - name: Start it and wait until it reports healthy
        run: |
          docker run -d --name horus -p 8000:8000 horus-media:ci
          for i in $(seq 1 40); do
            status="$(docker inspect --format '{{.State.Health.Status}}' horus)"
            echo "health: ${status}"
            [ "${status}" = "healthy" ] && exit 0
            sleep 3
          done
          docker logs horus
          exit 1

      - name: Check what it serves and who it runs as
        run: |
          curl -fsS http://127.0.0.1:8000/api/health
          curl -fsS http://127.0.0.1:8000/ | grep -q 'id="app"'
          curl -fsS http://127.0.0.1:8000/favicon.svg | grep -q "<svg"
          test "$(docker exec horus id -u)" = "10001"

      - name: Create an admin account in the data volume
        run: |
          echo "a long throwaway password" | docker exec -i horus python -m horus_media create-admin --username ci-user

      - name: Show the container log if anything failed
        if: failure()
        run: docker logs horus

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web UI
        run: |
          cd web
          npm ci
          npm run build
