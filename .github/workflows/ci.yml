name: CI

# Tests and lint for the Python code, and a build of the web UI, on every push to main and on
# every pull request. No live Plex or Emby server is involved: the tests use recorded responses.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip

      # The same exact, hash-checked dependencies the Docker image is built from, so the tests
      # run against what is shipped. Then Horus itself and the two test tools.
      - name: Install
        run: |
          pip install --require-hashes -r requirements.txt
          pip install --no-deps -e .
          pip install "pytest>=8" "ruff>=0.6"
          pip check

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  # The image is published for both processor types, so it is built and started on a runner of
  # each type (no emulation).
  docker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check the compose example
        run: docker compose -f compose.example.yaml config --quiet

      - name: Build the image
        run: |
          docker build -t horus-media:ci .
          built="$(docker image inspect --format '{{.Architecture}}' horus-media:ci)"
          echo "built for: ${built}"
          [ "${built}" = "${ARCH}" ]

      - name: Start it and wait until it reports healthy
        run: |
          docker run -d --name horus -p 8000:8000 horus-media:ci
          for i in $(seq 1 40); do
            status="$(docker inspect --format '{{.State.Health.Status}}' horus)"
            echo "health: ${status}"
            [ "${status}" = "healthy" ] && exit 0
            sleep 3
          done
          docker logs horus
          exit 1

      - name: Check what it serves and who it runs as
        run: |
          curl -fsS http://127.0.0.1:8000/api/health
          curl -fsS http://127.0.0.1:8000/ | grep -q 'id="app"'
          curl -fsS http://127.0.0.1:8000/favicon.svg | grep -q "<svg"
          test "$(docker exec horus id -u)" = "10001"

      - name: Create an admin account in the data volume
        run: |
          echo "a long throwaway password" | docker exec -i horus python -m horus_media create-admin --username ci-user

      - name: Show the container log if anything failed
        if: failure()
        run: docker logs horus

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web UI
        run: |
          cd web
          npm ci
          npm run build
